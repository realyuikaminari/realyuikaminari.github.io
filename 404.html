<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost on the pass — Yui Kaminari's Garage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+JP:wght@400;700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=10">
  <link rel="icon" href="favicon.ico">
  <style>
    .lost { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 2rem; }

    .lost p { color: var(--muted); max-width: 28rem; margin: 0 auto 1.6rem; }
  </style>
</head>
<body>
  <main class="lost">
    <div>
      <p class="eyebrow">404  ·  峠にまよった</p>
      <h1>WRONG<br>TURN</h1>
      <p>This switchback doesn’t go anywhere. Head back to the Garage and pick a new line.</p>
      <a class="btn btn-primary" href="./">Back to the Garage</a>
    </div>
  </main>
